<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Hiload System — offline shell. Reconnect to continue." />
    <title>Offline · Hiload System</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0a0a0a;
        --fg: #f4faf8;
        --muted: rgba(244, 250, 248, 0.65);
        --accent: #2dd4bf;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4faf8;
          --fg: #0f172a;
          --muted: #475569;
          --accent: #0f766e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: var(--muted); max-width: 28rem; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 700;
        background: var(--accent);
        color: #041512;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Hiload System needs a connection for live data. Cached pages may still open when you return online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
